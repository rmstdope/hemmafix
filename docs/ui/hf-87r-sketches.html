<!doctype html>
<!--
  A starter sheet for one round of concept sketches (skills/agree-experience, "Sketching the idea
  first"; the agreed look is docs/ui/cb-icwi-concept-sketches.html). Copy it to the scratchpad as
  <id>-sketches-<round>.html, set TITLE and IDEAS, and replace each idea's draw function. Two to
  four ideas, never one and never more. Set AGREED to the agreed idea's letter only for the copy
  kept in docs/ui/: it circles that idea in red and writes "agreed" beside it.

  The look is marker on a whiteboard: wobbly doubled strokes, a handwriting typeface, real words on
  the screen, one blue accent plus hatched fill for what the idea is about, red notes and arrows in
  the margin. Rectangles and words only; no styling, no exact sizes.
-->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketches</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#fdfcf8;font-family:system-ui,sans-serif;color:#222}
  header{padding:14px 20px;border-bottom:1px solid #ddd;background:#fff}
  h1{margin:0;font-size:18px} p{margin:4px 0 0;font-size:13px;color:#555}
  main{padding:20px}
  svg{max-width:100%;height:auto;background:#fffef9;border:1px solid #e6e2d6;border-radius:4px}
</style>
<script>
// The hand-drawn helper. Every stroke is drawn twice with a little jitter; the seed is fixed so a
// sheet looks the same each time it is opened.
const BLUE = '#1971c2', RED = '#c92a2a', INK = '#1e1e1e';
function Sketch(svg, o){ this.svg = svg; this.o = Object.assign({stroke: INK, w: 2.4, jit: 1.4, double: true, font: "'Caveat', cursive"}, o || {}); this.seed = 7; }
Sketch.prototype.r = function(){ this.seed = (this.seed * 9301 + 49297) % 233280; return this.seed / 233280 - 0.5; };
Sketch.prototype.add = function(tag, attrs, text){ const e = document.createElementNS('http://www.w3.org/2000/svg', tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (text) e.textContent = text; this.svg.appendChild(e); return e; };
Sketch.prototype.line = function(x1, y1, x2, y2, o){ o = Object.assign({}, this.o, o || {}); for (let p = 0; p < (o.double ? 2 : 1); p++){ const j = o.jit, mx = (x1 + x2) / 2 + this.r() * j * 2, my = (y1 + y2) / 2 + this.r() * j * 2; this.add('path', {d: `M${x1 + this.r() * j},${y1 + this.r() * j} Q${mx},${my} ${x2 + this.r() * j},${y2 + this.r() * j}`, fill: 'none', stroke: o.stroke, 'stroke-width': o.w * (p ? 0.7 : 1), 'stroke-linecap': 'round', opacity: p ? 0.6 : 1}); } };
Sketch.prototype.rect = function(x, y, w, h, o){ this.line(x, y, x + w, y, o); this.line(x + w, y, x + w, y + h, o); this.line(x + w, y + h, x, y + h, o); this.line(x, y + h, x, y, o); };
Sketch.prototype.hachure = function(x, y, w, h, color, gap){ gap = gap || 8; for (let i = -h; i < w; i += gap){ const ax = Math.max(x, x + i), ay = y + Math.max(0, -i), bx = Math.min(x + w, x + i + h), by = y + Math.min(h, w - i); this.line(ax, ay, bx, by, {stroke: color || BLUE, w: 1.3, double: false, jit: 0.8}); } };
Sketch.prototype.text = function(x, y, s, o){ o = Object.assign({size: 22, fill: this.o.stroke, anchor: 'start'}, o || {}); this.add('text', {x, y, 'font-family': this.o.font, 'font-size': o.size, fill: o.fill, 'text-anchor': o.anchor}, s); };
Sketch.prototype.arrow = function(x1, y1, x2, y2, o){ this.line(x1, y1, x2, y2, o); const a = Math.atan2(y2 - y1, x2 - x1); this.line(x2, y2, x2 - 12 * Math.cos(a - 0.5), y2 - 12 * Math.sin(a - 0.5), o); this.line(x2, y2, x2 - 12 * Math.cos(a + 0.5), y2 - 12 * Math.sin(a + 0.5), o); };
Sketch.prototype.note = function(x, y, s){ this.text(x, y, s, {fill: RED}); };
// A loose hand-drawn loop, squarish so it takes in a box's corners: the kept sheet's mark on the agreed idea.
Sketch.prototype.ring = function(cx, cy, rx, ry){ const f = t => Math.sign(t) * Math.pow(Math.abs(t), 0.3); let d = ''; for (let a = 0; a <= 6.75; a += 0.12){ const k = 1 + this.r() * 0.025 + (a > 6.3 ? 0.04 : 0); d += (a ? ' L' : 'M') + (cx + rx * k * f(Math.cos(a))) + ',' + (cy + ry * k * f(Math.sin(a))); } this.add('path', {d, fill: 'none', stroke: RED, 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}); };
</script></head><body>
<header><h1 id="title"></h1><p>Rough sketches of the idea. Which idea do we build on?</p></header>
<main><svg id="sheet"></svg></main>
<script>
// ---- Edit from here --------------------------------------------------------------------------
const TITLE = 'A calm task row — title and ⌄ on top, details and coin below';
const AGREED = 'A';
function phone(s){ s.rect(10, 10, 330, 340); s.text(24, 38, 'Idag', {size: 20, fill: '#666'}); }
function ck(s, x, y, done){ s.add('circle', {cx: x, cy: y, r: 15, fill: 'none', stroke: '#1e1e1e', 'stroke-width': 2}); s.text(x, y + 7, done ? '↺' : '✓', {size: 20, anchor: 'middle', fill: done ? '#1e1e1e' : '#aaa'}); }
function coin(s, x, y, n){ s.rect(x, y - 14, 44, 22, {stroke: BLUE}); s.hachure(x, y - 14, 44, 22, BLUE, 10); s.text(x + 22, y + 4, '● ' + n, {size: 17, anchor: 'middle', fill: BLUE}); }
const IDEAS = [
  {letter: 'A', name: 'long title wraps', cost: 'a long title makes its row taller', draw(s){
    phone(s);
    s.rect(20, 50, 310, 82); ck(s, 44, 90);
    s.text(68, 76, 'Städa badrummet ordentligt'); s.text(68, 98, 'och byt handdukar'); s.text(304, 78, '⌄', {size: 22});
    s.text(68, 122, 'Badrum · Idag · Erik', {size: 16, fill: '#666'}); coin(s, 270, 118, 30);
    s.rect(20, 144, 310, 60); ck(s, 44, 174);
    s.text(68, 168, 'Dammsuga'); s.text(304, 170, '⌄', {size: 22});
    s.text(68, 194, 'Hall · Imorgon', {size: 16, fill: '#666'}); coin(s, 270, 190, 20);
    s.rect(20, 216, 310, 60); ck(s, 44, 246, true);
    s.text(68, 240, 'Vattna blommorna', {fill: '#888'}); s.line(68, 234, 196, 234, {stroke: '#888', w: 1.2, double: false}); s.text(290, 242, '👏', {size: 18});
    s.text(68, 266, 'Klar av Erik', {size: 16, fill: '#666'}); coin(s, 270, 262, 5);
    s.rect(20, 288, 310, 56); s.text(32, 310, 'Torka av bänkarna'); s.text(250, 312, '✎   🗑', {size: 20}); coin(s, 32, 334, 10);
    s.note(350, 80, 'title + ⌄'); s.note(350, 120, 'details + coin'); s.arrow(380, 128, 318, 120, {stroke: RED, w: 1.6});
    s.note(350, 250, 'done: 👏 up top,'); s.note(350, 272, 'coin below');
    s.note(350, 316, 'routine: coin'); s.note(350, 338, 'under the name');
  }},
  {letter: 'B', name: 'long title cut …', cost: 'long titles hidden; rows all the same height', draw(s){
    phone(s);
    s.rect(20, 50, 310, 60); ck(s, 44, 80);
    s.text(68, 74, 'Städa badrummet ord…'); s.text(304, 76, '⌄', {size: 22});
    s.text(68, 100, 'Badrum · Idag · Erik', {size: 16, fill: '#666'}); coin(s, 270, 96, 30);
    s.rect(20, 122, 310, 60); ck(s, 44, 152);
    s.text(68, 146, 'Dammsuga'); s.text(304, 148, '⌄', {size: 22});
    s.text(68, 172, 'Hall · Imorgon', {size: 16, fill: '#666'}); coin(s, 270, 168, 20);
    s.rect(20, 194, 310, 60); ck(s, 44, 224, true);
    s.text(68, 218, 'Vattna blommorna', {fill: '#888'}); s.text(290, 220, '👏', {size: 18});
    s.text(68, 244, 'Klar av Erik', {size: 16, fill: '#666'}); coin(s, 270, 240, 5);
    s.rect(20, 266, 310, 56); s.text(32, 288, 'Torka av bänkarna'); s.text(250, 290, '✎   🗑', {size: 20}); coin(s, 32, 312, 10);
    s.note(350, 80, 'whole title'); s.note(350, 102, 'shows when ⌄'); s.note(350, 124, 'opens');
  }},
];
// ---- to here ---------------------------------------------------------------------------------
document.title = TITLE + ' — sketches';
document.getElementById('title').textContent = TITLE;
(function(){
  const svg = document.getElementById('sheet'), cell = 430, left = 30, scale = 0.7, h = 385;
  svg.setAttribute('viewBox', `0 0 ${IDEAS.length * cell + left} ${h}`);
  svg.setAttribute('width', IDEAS.length * cell + left);
  IDEAS.forEach((idea, i) => {
    const x = left + i * cell;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('transform', `translate(${x},28) scale(${scale})`);
    svg.appendChild(g);
    idea.draw(new Sketch(g));
    const s = new Sketch(svg);
    s.text(x + 5, 308, `${idea.letter} — ${idea.name}`, {size: 24});
    s.text(x + 5, 333, idea.cost, {size: 20, fill: '#666'});
    if (AGREED === idea.letter){ s.ring(x + 190, 184, 214, 176); s.text(x + 330, 378, 'agreed', {size: 26, fill: RED}); }
  });
})();
</script></body></html>
