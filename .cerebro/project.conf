# What is true about THIS project, read one key at a time by .cerebro/cerebro/scripts/project-conf.
# Written by .cerebro/cerebro/scripts/install from its interview, and edited by hand after that.
# Tracked, so every clone runs on the same declaration.
#
# `key value', one per line, the value running to the end of the line. Everything from a `#' on
# is a comment, wherever it starts, so a value can never contain one. An absent key is a default.

project_name   hemmafix
default_branch main

# What the agents call the people who use the application.
audience_noun  family member

# A regex: which changed paths those people could see. Required - without it the fleet refuses to
# classify a change rather than guess.
app_paths      ^(src|public)/|^next\.config\.ts$

# What an implementer runs before it opens a pull request, and what a pull request is judged by.
# An implementer does not start until gate_fast is declared (or detected from a package.json,
# Makefile or Cargo.toml): with no gate there is nothing to be green.
# Both need the local Postgres from README "Kom igång" (TEST_DATABASE_URL, else DATABASE_URL
# from .env). The full gate mirrors .github/workflows/ci.yml - the schema and the migrations agree,
# the production build, the end-to-end tests of that build - except CI's db:migrate on an empty
# database, which here would migrate the dev database; test:int already migrates fresh ones.
gate_fast      (pnpm run lint && pnpm run typecheck && pnpm run test && pnpm run test:int)
gate_full      (pnpm run lint && pnpm run typecheck && pnpm run test && pnpm run test:int && pnpm exec drizzle-kit generate --name gate-drift-check && test -z "$(git status --porcelain drizzle)" && pnpm run build && pnpm run test:e2e)

# What installs dependencies into a fresh worktree. Detected from a lockfile when absent.
# Declared as install_shell below: a worktree has no .env (it is ignored), so it gets a copy of
# the main checkout's - the tests, drizzle and `pnpm dev' read DATABASE_URL and auth from it.
#install        <command>

# Everything below is optional and off. Uncomment a line to declare it.

# Building
install_shell           main="$(dirname "$(git rev-parse --path-format=absolute --git-common-dir)")"; if [ -f "$main/.env" ] && [ ! -f .env ]; then cp "$main/.env" .env; fi; pnpm install --frozen-lockfile
prewarm                 pnpm build:fresh     # the production build the verifier serves (and Cypher looks at), from a clean .next: a kept Turbopack cache served stale CSS
#rust_paths              ^(Cargo\.(toml|lock)$|crates/)   # regex: which changed paths Cargo builds
#disk_floor_gb           2                    # GB free below which no bead starts; absent: no disk preflight
#disk_floor_non_rust_gb  1                    # the same floor when the change needs no Cargo build
#reclaim_dirs            target               # directories the disk preflight and the worktree pruner may reclaim
#cargo_reclaim_packages  <package>            # packages `cargo clean --package' may reclaim

# Verifying: how the verifier starts what a person can look at
launch_targets          web
launch_web              node --env-file=.env scripts/verify-app.mjs serve   # the merged build on the local hemmafix_verify database; the login is kept
launch_web_port         3000
#verification            none                 # nothing here can be looked at (a library, a tool)
verification_skill      verify-hemmafix      # Hemmafix's own skill, extending verify-bead: Psylocke looks herself
#fixtures_doc            docs/fixtures.md     # where the verifier reads which fixtures exist

# Ports: one block per worktree, so parallel implementers' servers never collide
port_base               3200                 # the first port of the first block
port_block_size         10                   # ports per block
port_env                E2E_PORT             # read by e2e/support/env.ts; unset means 3100

# The navigator: which of a producer's decisions you take part in. Any of the three, in any order;
# absent means none. `plan' puts the design to you before the build starts; `review' asks for your
# review on the pull request after the fleet's own review; `merge' leaves the merge to you.
#navigator_gates        merge                # off: a producer merges once its review is done and CI is green

# The fleet
#role_start_spacing_producer 30            # seconds between two starts of one role; 0 never spaces it
#role_cadence_architect 3600               # seconds between passes of a clock role (user-feedback, reviewer, architect, qa)
#planner_buffer_multiple 1                    # planned beads wanted per implementer
#retro_dir               docs/retrospectives  # where retrospectives live, read by retro-sightings

# Delivery: how the fleet tells that a bead's work reached the default branch
#commit_ref_pattern      ({id}):              # how a commit subject names its bead
non_delivery_commit_pattern docs({id}): mockup   # subjects that are not deliveries (a planner's mockup commit)
#merged_check            gh                   # how a worktree's branch is judged landed when its commits are not on origin
