version: 2
updates:
  - package-ecosystem: npm # also covers pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: daily
    # pnpm's default minimumReleaseAge is one day; younger versions would fail to resolve.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
