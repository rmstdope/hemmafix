version: 2
# One pull request per ecosystem for the day's patch and minor updates; a major update matches no
# group and gets its own (src/lib/dependabot.test.ts).
updates:
  - package-ecosystem: npm # also covers pnpm (pnpm-lock.yaml)
    directory: /
    schedule:
      interval: daily
    # pnpm's default minimumReleaseAge is one day; younger versions would fail to resolve.
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
